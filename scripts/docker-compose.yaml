services:
  rabbitmq-pa3:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq-pa3
    hostname: rabbitmq-pa3
    volumes:
      - rabbitmq_pa3_data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  my-redis:
    image: redis:latest
    container_name: my-redis
    hostname: my-redis
    ports:
      - '6379:6379'

volumes:
  rabbitmq_pa3_data:
